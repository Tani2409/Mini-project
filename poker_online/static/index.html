<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>POKER Online</title>
  <link rel="stylesheet" href="/static/style.css?v=20260721d">
</head>
<body>
  <main>
    <section id="game" class="game">
      <header>
        <div class="brand small">♠ <span>POKER</span></div>
        <div class="room-info">
          <span>BÀN CHUNG <strong id="room-label">POKER</strong></span>
          <label class="name-control">Tên <input id="name" maxlength="18"></label>
          <button id="rename">LƯU TÊN</button>
          <button id="copy">SAO CHÉP LINK</button>
        </div>
      </header>

      <div class="table-wrap">
        <div class="table">
          <div class="dealer-zone"><div class="dealer-head">♣</div><b>DEALER</b></div>
          <div id="seats"></div>
          <div class="center-zone">
            <div id="board" class="cards board"></div>
            <div id="pot" class="pot">POT • 0</div>
            <div id="message" class="message">Đang kết nối bàn chơi...</div>
          </div>
        </div>
      </div>

      <div class="controls card-panel">
        <button id="start" class="gold hidden">CHIA BÀI</button>
        <div id="actions" class="hidden">
          <button data-action="fold" class="danger">FOLD</button>
          <button data-action="call">CHECK / CALL</button>
          <div class="raise-control">
            <label>CƯỢC TỚI <strong id="raise-value">40</strong></label>
            <input id="raise" type="range" min="40" max="1000" step="10" value="40">
          </div>
          <button data-action="raise" class="gold">RAISE</button>
        </div>
        <span id="turn-note">Đang kết nối...</span>
      </div>
    </section>
  </main>
  <script src="/static/app.js?v=20260721d" defer></script>
</body>
</html>
